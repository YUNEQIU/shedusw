      <p>“燕京八绝”包括景泰蓝、玉雕、牙雕、雕漆、金漆镶嵌、花丝镶嵌、宫毯、京绣八大工艺门类，曾在明清时期盛极一时，开创了中华传统工艺的高峰。但在历史的递嬗演变中，以“皇家工艺”为代表的“燕京八绝”曾一度遭遇手艺失传的危险境况，包括三个学习点位。
