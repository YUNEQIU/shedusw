<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电子书</title>
  <link rel="icon" href="images/logo.avif" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="top">
    <a href="#" class="return">
      <div class="return">
        <img src="images/return2.svg" alt="image" />
      </div>
    </a>
    <div class="title">
      <p>电子书</p>
    </div>
  </div>

  <div class="search" style="margin-bottom: 30px;">
    <input type="text" class="searchbox" placeholder="请搜索您感兴趣的的电子书">
    <div class="magnifier"><img src="images/magnifier.svg" alt="image" /></div>
  </div>

  <div class="container">

    <div class="cardbox">

      <div class="card">
        <img src="images/ebook_1.avif" alt="ebook">
        <p>白夜行</p>
      </div>
      <div class="card">
        <img src="images/ebook_2.avif" alt="ebook">
        <p>心理学最佳入门</p>
      </div>
      <div class="card">
        <img src="images/ebook_3.avif" alt="ebook">
        <p>围城</p>
      </div>
      <div class="card">
        <img src="images/ebook_4.avif" alt="ebook">
        <p>将门毒后</p>
      </div>
      <div class="card">
        <img src="images/ebook_5.avif" alt="ebook">
        <p>追风筝的人</p>
      </div>
      <div class="card">
        <img src="images/ebook_6.avif" alt="ebook">
        <p>平凡的世界</p>
      </div>
      <div class="card">
        <img src="images/ebook_7.avif" alt="ebook">
        <p>余秋雨选读</p>
      </div>
      <div class="card">
        <img src="images/ebook_8.avif" alt="ebook">
        <p>书问京都</p>
      </div>
      <div class="card">
        <img src="images/ebook_9.avif" alt="ebook">
        <p>漫画入门就这么简单</p>
      </div>
      <div class="card">
        <img src="images/ebook_10.avif" alt="ebook">
        <p>马斯克传</p>
      </div>
      <div class="card">
        <img src="images/ebook_11.avif" alt="ebook">
        <p>拾乐</p>
      </div>
      <div class="card">
        <img src="images/ebook_12.avif" alt="ebook">
        <p>无印良品管理笔记</p>
      </div>

    </div>

  </div>

  <script src="js/script.js" defer></script>

</body>

</html>
