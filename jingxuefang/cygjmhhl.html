      <h1>穿越古今 梦回红楼</h1>
      <p>“穿越古今
        梦回红楼”项目由北京市东方老年研修学院围绕中国四大名著之一的《红楼梦》以及87版电视剧《红楼梦》、北京著名景点“大观园”和“曹雪芹纪念馆”开发的研学游学线路，该游学线路跨越北京市西城区、海淀区和东城区三个区，包括三个学习点位。
      </p>
    </div>
