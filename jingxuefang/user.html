<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的信息</title>
  <link rel="icon" href="images/logo.avif" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="top">
    <a href="#" class="return">
      <div class="return">
        <img src="images/return2.svg" alt="image" />
      </div>
    </a>
    <div class="title">
      <p>我的信息</p>
    </div>

  </div>

  <div class="userimage">
    <img src="images/user.avif" alt="image" />
  </div>

  <div class="name">
    <h1>汪晓婕</h1>
  </div>

  <div class="information">

    <div class="row">

      <div class="plate">
        <img src="images/personalinformation.svg" alt="个人信息">
        <div class="caption"><p>个人信息</p></div>
      </div>

      <div class="plate">
        <img src="images/route.svg" alt="完成路线">
        <div class="caption"><p>完成路线</p></div>
      </div>

      <div class="plate">
        <img src="images/myfavorites.svg" alt="我的收藏">
        <div class="caption"><p>我的收藏</p></div>
      </div>

    </div>

    <div class="row">

      <div class="plate">
        <img src="images/checkin.svg" alt="打卡历史">
        <div class="caption"><p>打卡历史</p></div>
      </div>

      <div class="plate">
        <img src="images/myevent.svg" alt="我的活动">
        <div class="caption"><p>我的活动</p></div>
      </div>

      <div class="plate">
        <img src="images/mycertificate.svg" alt="我的证书">
        <div class="caption"><p>我的证书</p></div>
      </div>
      
    </div>

  </div>

  <script src="js/script.js" defer></script>

</body>

</html>
