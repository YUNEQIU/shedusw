      <p>燕山位于中国河北平原北侧，由潮白河谷到山海关，呈东西走向。长300多千米。面积1.44万公顷，其范围有广义与狭义之分，广义燕山系指坝上高原以南，河北平原以北，白河谷地以东，山海关以西的山地，狭义则指上述范围内窄岭、波罗诺、中关、大杖子一线以南的山地。包括三个学习点位。
      </p>
