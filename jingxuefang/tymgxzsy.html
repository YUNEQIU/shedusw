      <p>顺义区历史悠久，夏商周三代随北京地区属冀、幽、燕。明洪武元年（1368）12月，降顺州为顺义县，属北平府，后为顺天府所辖。1998年12月，撤销顺义县，设立顺义区。 顺义区是北京市“一核一主一副、两轴多点一区”城市空间结构中的“多点”之一，也是“国门”所在地、首都重点平原新城、中心城区适宜功能产业的重要承接地。包括三个学习点位。
